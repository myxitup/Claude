<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Hand;src:url(node_modules/@fontsource/patrick-hand/files/patrick-hand-latin-400-normal.woff2)}
@font-face{font-family:Bang;src:url(node_modules/@fontsource/bangers/files/bangers-latin-400-normal.woff2)}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:1280px;height:720px}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
Object.assign(window,(window.parent&&window.parent.RIGCFG)||{});
const cv=document.getElementById('c'),X=cv.getContext('2d'),W=1280,H=720,PI=Math.PI,TAU=PI*2,INK='#1d1b24';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,u)=>a+(b-a)*u,eo=t=>1-Math.pow(1-clamp(t),3);
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
function txt(s,x,y,size,col,font='Bang',align='center',stroke=0){X.font=`${size}px ${font}`;X.textAlign=align;X.textBaseline='middle';if(stroke){X.lineWidth=stroke;X.strokeStyle=INK;X.lineJoin='round';X.strokeText(s,x,y)}X.fillStyle=col;X.fillText(s,x,y)}
let D,F,IMG={},MO={},MM=null,NM={},MK={};const TMP=document.createElement('canvas'),TX=TMP.getContext('2d');const NAMES=window.RNAMES||['stand','sit','point','facepalm','cross','laugh','shrug','thumbs','shocked','thinking','sideeye','annoyed','excited','pointyou','explain','remote'];
window.ready=(async()=>{await document.fonts.load('30px Bang');await Promise.all(NAMES.map(n=>Promise.all(['__nm','__mask'].map(sf=>new Promise(r=>{const i=new Image();i.onload=()=>{(sf==='__nm'?NM:MK)[n]=i;r()};i.onerror=()=>r();i.src=window.POSEDIR+n+sf+'.png'})))));MM=window.MOUTHMETA;await Promise.all(['rest','smile','slight','ah','ee','oh','oo','fv','mbp'].map(n=>new Promise(r=>{const i=new Image();i.onload=()=>{MO[n]=i;r()};i.src=window.MOUTHDIR+n+'.png'})));await Promise.all(NAMES.map(n=>new Promise(r=>{const i=new Image();i.onload=()=>{IMG[n]=i;r()};i.src=window.POSEDIR+n+'.png'})));return true});
// ---------- room ----------
function room(t){
  let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3d3360');g.addColorStop(1,'#231c3a');X.fillStyle=g;X.fillRect(0,0,W,H);
  // wallpaper stripes
  X.fillStyle='rgba(255,255,255,.035)';for(let x=0;x<W;x+=64)X.fillRect(x,0,30,H*.72);
  // lamp glow + lamp
  g=X.createRadialGradient(1060,250,10,1060,250,420);g.addColorStop(0,'rgba(255,196,120,.42)');g.addColorStop(1,'rgba(255,196,120,0)');X.fillStyle=g;X.fillRect(0,0,W,H);
  X.strokeStyle=INK;X.lineWidth=5;X.fillStyle='#ffe0a6';X.beginPath();X.moveTo(1010,200);X.lineTo(1110,200);X.lineTo(1094,270);X.lineTo(1026,270);X.closePath();X.fill();X.stroke();
  X.strokeStyle='#c9bfa8';X.lineWidth=6;X.beginPath();X.moveTo(1060,270);X.lineTo(1060,610);X.stroke();X.fillStyle='#3a3048';X.beginPath();X.ellipse(1060,612,46,10,0,0,TAU);X.fill();
  // poster
  X.save();X.translate(230,210);X.rotate(-.05);X.fillStyle='#f4ead2';X.fillRect(-90,-110,180,220);X.strokeStyle=INK;X.lineWidth=5;X.strokeRect(-90,-110,180,220);
  txt('NAH.',0,-20,92,'#e5383b');X.font='22px Hand';X.fillStyle=INK;X.textAlign='center';X.fillText('I don’t believe that',0,62);X.restore();
  // window with night sky
  X.fillStyle='#0e1430';X.fillRect(430,90,240,180);for(let i=0;i<14;i++){X.fillStyle=`rgba(255,255,255,${.4+.4*Math.sin(t*2+i)})`;X.fillRect(440+rnd(i)*220,100+rnd(i+7)*160,2,2)}
  X.fillStyle='#fff3c0';X.beginPath();X.arc(620,140,20,0,TAU);X.fill();X.fillStyle='#0e1430';X.beginPath();X.arc(630,134,18,0,TAU);X.fill();
  X.strokeStyle=INK;X.lineWidth=7;X.strokeRect(430,90,240,180);X.beginPath();X.moveTo(550,90);X.lineTo(550,270);X.moveTo(430,180);X.lineTo(670,180);X.stroke();
  // floor
  X.fillStyle='#5a4636';X.fillRect(0,640,W,80);X.fillStyle='rgba(0,0,0,.15)';for(let x=0;x<W;x+=120)X.fillRect(x,640,3,80);
  // couch
  X.fillStyle='#2f8f83';X.strokeStyle=INK;X.lineWidth=6;X.beginPath();X.roundRect(330,430,620,150,30);X.fill();X.stroke();
  X.fillStyle='#38a597';X.beginPath();X.roundRect(310,545,660,95,22);X.fill();X.stroke();
  X.beginPath();X.roundRect(280,480,80,160,24);X.fill();X.stroke();X.beginPath();X.roundRect(920,480,80,160,24);X.fill();X.stroke();
  X.fillStyle='#27776d';X.fillRect(350,640,30,22);X.fillRect(900,640,30,22);
}
// ---------- character ----------
const SC=window.RSC||1.25,ANCHOR_X=window.RAX||650,FLOOR=window.RFL||700;
function poseAt(t){let i=0;while(i+1<D.poses.length&&t>=D.poses[i+1].t)i++;return{cur:D.poses[i],prev:D.poses[i-1]||D.poses[i]}}
function visAt(t){let v='rest';for(const x of D.vis){if(x.t>t)break;v=x.v}const talking=D.words.some(w=>t>=w[1]-.05&&t<=w[2]+.08);return talking?v:'rest'}
function blinkAt(t){const k=Math.floor(t/3.1),s=k*3.1+rnd(k)*1.6+.6;return t>s&&t<s+.13}
const shotOf=n=>!window.MIX?(window.BUST?'bust':'stand'):n.startsWith('h_')?'bust':n.startsWith('sit')?'couch':'stand';
const FR={bust:{sc:1.9,ax:640,fl:770},couch:{sc:1.25,ax:650,fl:700},stand:{sc:1.3,ax:640,fl:708}};
function frameOf(n){return window.MIX?FR[shotOf(n)]:{sc:SC,ax:ANCHOR_X,fl:FLOOR}}
function drawPose(name,t,alpha,squash,talkV,blink){const fr=frameOf(name);
  const im=IMG[name],f=F[name],mx=f.ax||(f.mouth?f.mouth[0]:im.width/2);
  const bob=Math.sin(t*2.4)*.006,sway=Math.sin(t*1.1)*.006;
  X.save();X.globalAlpha=alpha;X.translate(fr.ax,fr.fl);X.rotate(sway);X.scale(fr.sc*(1+squash*.5),fr.sc*(1+bob-squash));
  if(name==='laugh'){X.translate(0,-Math.abs(Math.sin(t*14))*3)}
  X.translate(-mx,-im.height);
  const talk=f.mouth&&!f.noLip&&name!=='facepalm'&&name!=='laugh'&&talkV!=='rest'&&MO[talkV]&&NM[name]&&MK[name];
  X.drawImage(talk?NM[name]:im,0,0);
  const sk=`rgb(${F.skin})`;
  if(talk){const[cx,cy,w,h]=f.mouth,mm=MM[talkV],sc=w*.95/MM.rest.w;
    if(TMP.width!==im.width||TMP.height!==im.height){TMP.width=im.width;TMP.height=im.height}
    TX.globalCompositeOperation='source-over';TX.clearRect(0,0,TMP.width,TMP.height);
    TX.drawImage(MO[talkV],cx-mm.ax*sc,cy-mm.ay*sc,mm.w*sc,mm.h*sc);
    TX.globalCompositeOperation='destination-in';TX.drawImage(MK[name],0,0);TX.globalCompositeOperation='source-over';
    X.drawImage(TMP,0,0)}
  // blink
  if(blink)for(const[ex,ey,ew,eh]of f.eyes){X.fillStyle=sk;X.beginPath();X.ellipse(ex,ey,ew/2+2.5*(f.ms||1),eh/2+2.5*(f.ms||1),0,0,TAU);X.fill();X.strokeStyle=INK;X.lineWidth=2.6*(f.ms||1);X.beginPath();X.moveTo(ex-ew/2,ey);X.quadraticCurveTo(ex,ey+3,ex+ew/2,ey-1);X.stroke()}
  X.restore()}
function character(t){
  const{cur,prev}=poseAt(t),u=clamp((t-cur.t)/.14),squash=Math.sin(PI*clamp((t-cur.t)/.22))*.05;
  const v=visAt(t),b=blinkAt(t)&&shotOf(cur.p)!=='bust'&&!window.BUST;
  // floor shadow
  const fr=frameOf(cur.p),cut=shotOf(prev.p)!==shotOf(cur.p);
  if(shotOf(cur.p)!=='bust'){X.fillStyle='rgba(0,0,0,.28)';X.beginPath();X.ellipse(fr.ax+10,fr.fl+2,150,16,0,0,TAU);X.fill()}
  if(u<1&&prev!==cur&&!cut)drawPose(prev.p,t,1-u,0,'rest',false);
  drawPose(cur.p,t,cut?1:(u<1?u:1),cut?0:squash,v,b)}
function captions(t){let cur=-1;for(let i=0;i<D.words.length;i++)if(t>=D.words[i][1]-.04&&t<=D.words[i][2]+.3)cur=i;if(cur<0)return;
  let s=cur;while(s>0&&cur-s<3&&!/[.?!,]$/.test(D.words[s-1][0]))s--;const ch=[];for(let i=s;i<D.words.length&&ch.length<4;i++){ch.push(i);if(/[.?!,]$/.test(D.words[i][0])&&i>=cur)break}
  X.font='54px Bang';const parts=ch.map(i=>D.words[i][0].toUpperCase()),wd=parts.map(p=>X.measureText(p).width),tot=wd.reduce((a,b)=>a+b,0)+16*(parts.length-1);let x=W/2-tot/2;
  parts.forEach((p,j)=>{const i=ch[j],on=t>=D.words[i][1]-.04&&t<=D.words[i][2]+.05,act=t>=D.words[i][1]-.04;X.save();X.translate(x+wd[j]/2,90);if(on)X.scale(1.1,1.1);txt(p,0,0,54,on?'#ffd23f':(act?'#fff':'rgba(255,255,255,.5)'),'Bang','center',10);X.restore();x+=wd[j]+16})}
window.render=function(t){X.setTransform(1.5,0,0,1.5,0,0);
  const{cur,prev}=poseAt(t),shot=shotOf(cur.p),cutT=shotOf(prev.p)!==shotOf(cur.p)?t-cur.t:9,punch=cutT<.2?1+.05*(1-cutT/.2):1;
  X.translate(W/2,H/2);X.scale(punch,punch);X.translate(-W/2,-H/2);
  if(shot==='bust'){X.save();X.translate(640,330);X.scale(1.55,1.55);X.translate(-640,-330);room(t);X.restore()}else room(t);
  character(t);X.setTransform(1.5,0,0,1.5,0,0);
  if(cutT<.08){X.fillStyle=`rgba(255,255,255,${.22*(1-cutT/.08)})`;X.fillRect(0,0,W,H)}
  if(window.NOCAP)return;captions(t);
  const v=X.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.35)');X.fillStyle=v;X.fillRect(0,0,W,H);
  const f=Math.max(1-clamp(t/.3),clamp((t-(D.total-.4))/.4));if(f>0){X.fillStyle=`rgba(0,0,0,${f})`;X.fillRect(0,0,W,H)}};
window.setData=(d,f)=>{D=d;F=f};
</script></body></html>
